services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission;Username=postgres;Password=postgres"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: "http://localhost:8080"
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Optional: run backend tests  ->  docker compose --profile test run --rm backend-tests
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
